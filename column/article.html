<!DOCTYPE html>
<html lang="ja">
<head>
<style>
    /* ── breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      letter-spacing: .1em;
      margin-bottom: 0;
    }
    .breadcrumb a { color: rgba(240,235,224,.55); text-decoration: none; transition: color .2s; }
    .breadcrumb a:hover { color: #F0EBE0; }
    .breadcrumb .sep { color: rgba(240,235,224,.3); font-size: 10px; }
    .breadcrumb .cur {
      color: rgba(240,235,224,.42);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── article layout ── */
    .art-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .art-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .col-tag {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .1em;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 3px 10px;
      border-radius: 1px;
      white-space: nowrap;
    }
    .art-date {
      font-size: 12px;
      letter-spacing: .1em;
      color: var(--sub);
    }
    .art-title {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(20px, 2.8vw, 32px);
      letter-spacing: .08em;
      line-height: 1.65;
      color: var(--dark);
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    /* ── rich text body ── */
    .art-body {
      font-size: 15px;
      line-height: 2;
      letter-spacing: .04em;
      color: var(--mid);
      margin-bottom: 72px;
    }
    .art-body h2 {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(17px, 2vw, 22px);
      letter-spacing: .08em;
      line-height: 1.6;
      color: var(--dark);
      margin: 52px 0 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .art-body h3 {
      font-weight: 500;
      font-size: 16px;
      letter-spacing: .06em;
      color: var(--dark);
      margin: 36px 0 14px;
    }
    .art-body p { margin-bottom: 22px; }
    .art-body ul, .art-body ol { padding-left: 22px; margin-bottom: 22px; }
    .art-body li { margin-bottom: 8px; }
    .art-body a { color: var(--accent); text-decoration: underline; }
    .art-body strong { font-weight: 500; color: var(--dark); }
    .art-body em { font-style: italic; }
    .art-body img { max-width: 100%; height: auto; display: block; margin: 32px auto; border-radius: 1px; }
    .art-body blockquote {
      border-left: 2px solid var(--gold);
      padding: 14px 20px;
      margin: 28px 0;
      color: var(--sub);
    }
    .art-body hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
    .art-body table { width: 100%; border-collapse: collapse; margin-bottom: 22px; font-size: 14px; }
    .art-body th, .art-body td { border: 1px solid var(--line); padding: 10px 14px; text-align: left; }
    .art-body th { background: var(--cream); font-weight: 500; }

    /* ── CTA ── */
    .art-cta {
      background: var(--cream);
      padding: 72px 0 64px;
    }
    .art-cta-inner { max-width: 560px; margin: 0 auto; text-align: center; }
    .art-cta-label {
      font-size: 10px;
      letter-spacing: .4em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .art-cta-h {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: .1em;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .art-cta-sub {
      font-size: 13px;
      letter-spacing: .1em;
      color: var(--sub);
      margin-bottom: 36px;
    }
    .art-cta-btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* ── back link ── */
    .art-back {
      padding: 40px 0 16px;
      text-align: center;
    }
    .art-back a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: .16em;
      color: var(--sub);
      text-decoration: none;
      transition: color .2s;
    }
    .art-back a:hover { color: var(--dark); }
    .art-back a::before {
      content: '';
      display: inline-block;
      width: 22px;
      height: 1px;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── loading / error ── */
    .art-state {
      text-align: center;
      padding: 100px 0;
      color: var(--sub);
      font-size: 13px;
      letter-spacing: .1em;
    }
    .art-spinner {
      display: block;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(107,101,96,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
</html>
