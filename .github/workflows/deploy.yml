name: Deploy to XServer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [microcms-publish]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env for build
        run: |
          cat > .env <<EOF
          MICROCMS_API_KEY=${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_SERVICE_DOMAIN=${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_COLUMN_ENDPOINT=${{ secrets.MICROCMS_COLUMN_ENDPOINT }}
          EOF

      - name: Build columns
        run: node scripts/build-columns.mjs

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /acus-fukuyama.com/public_html/
          security: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/upload_sftp.py
            **/*.key
            **/scripts/**
